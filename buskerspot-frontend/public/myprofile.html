<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; margin: 20px 0; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .section { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        textarea { resize: vertical; height: 80px; }
        button { width: 100%; padding: 10px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; color: white; margin-top: 5px; }
        .btn-success:hover { background-color: #218838; }
        .btn-danger { background-color: #dc3545; color: white; margin-top: 10px; }
        .btn-danger:hover { background-color: #c82333; }
        .nav-link { text-align: center; margin-top: 15px; }
        .nav-link a { color: #007bff; text-decoration: none; }
        .nav-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>마이페이지</h2>

    <div class="section">
        <h3>프로필 정보 수정</h3>
        <form id="profileUpdateForm">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" required>
            
            <label for="band_name">아티스트/밴드명</label>
            <input type="text" id="band_name" placeholder="밴드명을 입력하세요">

            <label for="genre">장르 (카테고리)</label>
            <select id="genre">
                <option value="">선택하세요</option>
                <option value="어쿠스틱">어쿠스틱</option>
                <option value="밴드">밴드</option>
                <option value="힙합">힙합</option>
                <option value="보컬">보컬</option>
                <option value="기타연주">기타연주</option>
                <option value="기타">기타</option>
            </select>
            
            <label for="introduction">자기소개</label>
            <textarea id="introduction" placeholder="소개글을 입력하세요"></textarea>

            <button type="submit" class="btn-success">프로필 저장</button>
        </form>
    </div>

    <div class="section">
        <h3>비밀번호 변경</h3>
        <form id="passwordChangeForm">
            <label for="currentPassword">현재 비밀번호</label>
            <input type="password" id="currentPassword" required>
            
            <label for="newPassword">새 비밀번호</label>
            <input type="password" id="newPassword" required>
            
            <button type="submit" class="btn-primary">비밀번호 변경</button>
        </form>
    </div>

    <div class="section">
        <h3>회원 탈퇴</h3>
        <label for="withdrawPassword">비밀번호 확인</label>
        <input type="password" id="withdrawPassword" placeholder="탈퇴하려면 비밀번호를 입력하세요" required>
        <button type="button" id="withdrawBtn" class="btn-danger">회원 탈퇴</button>
    </div>

    <div class="nav-link">
        <a href="/">홈으로 돌아가기</a>
    </div>
</div>

<script>
    // 페이지 로드 시 기존 유저 정보를 불러와서 input 창에 채워넣기
    window.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('token');
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/'; // 또는 로그인 페이지 경로
            return;
        }

        try {
            const res = await fetch('/api/auth/me', {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const user = await res.json();
            
            if (res.ok) {
                document.getElementById('nickname').value = user.nickname || '';
                document.getElementById('band_name').value = user.band_name || '';
                document.getElementById('genre').value = user.genre || '';
                document.getElementById('introduction').value = user.introduction || '';
            }
        } catch (err) {
            console.error('유저 정보 로드 실패:', err);
        }
    });

    // 1. 프로필 수정 요청
    document.getElementById('profileUpdateForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nickname = document.getElementById('nickname').value;
        const band_name = document.getElementById('band_name').value;
        const genre = document.getElementById('genre').value;
        const introduction = document.getElementById('introduction').value;
        const token = localStorage.getItem('token');

        try {
            const res = await fetch('/api/auth/profile', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ nickname, band_name, genre, introduction })
            });
            const data = await res.json();
            
            if (data.success) {
                alert('프로필이 성공적으로 수정되었습니다.');
                location.reload();
            } else {
                alert(data.message || '프로필 수정 실패');
            }
        } catch (err) {
            console.error(err);
            alert('서버 오류가 발생했습니다.');
        }
    });

    // 2. 비밀번호 변경 요청
    document.getElementById('passwordChangeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const token = localStorage.getItem('token');

        try {
            const res = await fetch('/api/auth/password', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ currentPassword, newPassword })
            });
            const data = await res.json();
            if (data.success) {
                alert('비밀번호가 변경되었습니다. 다시 로그인해주세요.');
                localStorage.removeItem('token');
                window.location.href = '/';
            } else {
                alert(data.message || '변경 실패');
            }
        } catch (err) {
            console.error(err);
            alert('서버 오류가 발생했습니다.');
        }
    });

    // 3. 회원 탈퇴 요청
    document.getElementById('withdrawBtn').addEventListener('click', async () => {
        const password = document.getElementById('withdrawPassword').value;
        if (!password) {
            alert('비밀번호를 입력해주세요.');
            return;
        }
        if (!confirm('정말 탈퇴하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;

        const token = localStorage.getItem('token');

        try {
            const res = await fetch('/api/auth/account', {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (data.success) {
                alert('회원 탈퇴가 완료되었습니다.');
                localStorage.removeItem('token');
                window.location.href = '/';
            } else {
                alert(data.message || '탈퇴 실패');
            }
        } catch (err) {
            console.error(err);
            alert('서버 오류가 발생했습니다.');
        }
    });
</script>

</body>
</html>
